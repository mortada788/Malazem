<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>ملخص مناهج خامس علمي</title>
<style>
  :root{--card:rgba(255, 255, 255, 0.95);--text:#1d2433;--muted:#64748b;--primary:#1a73e8;--line:#e2e8f0;--radius:16px}
  body.dark-mode { --card: rgba(30, 41, 59, 0.95); --text: #f1f5f9; --muted: #94a3b8; --line: #334155; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body { margin: 0; font-family: system-ui; color: var(--text); padding-bottom: 20px; background: linear-gradient(-45deg, #5b21b6, #7e22ce, #6d28d9, #4c1d95); background-size: 400% 400%; animation: gradientBG 15s ease infinite; }
  body.dark-mode { background: linear-gradient(-45deg, #2e1065, #3b0764, #1e1b4b, #0f172a); background-size: 400% 400%; }
  @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  
  #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 9999; color: white;}
  .glass-container { text-align: center; padding: 50px 30px; border-radius: 24px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); width: 85%; max-width: 350px; }
  .welcome-text { font-size: 36px; font-weight: 900; color: #fff; }
  
  #name-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; }
  .name-box { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; width: 80%; max-width: 300px;}
  .name-box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; text-align: center;}
  .name-box button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; }
  
  header{background:var(--primary);color:#fff;padding:15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
  header h1{font-size:18px;margin:0;flex:1;}
  .header-btn { background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; display: none; }
  
  main{padding:15px; max-width: 600px; margin: auto;}
  .points-card { background: #f59e0b; color: white; border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 15px; }
  .menu-card { background: var(--card); display: flex; justify-content: space-between; padding: 20px; border-radius: 15px; color: var(--text); margin-bottom: 10px; cursor: pointer; text-decoration: none; font-weight: bold;}
  .gif-container { margin-top: 20px; text-align: center; }
  .gif-container img { width: 100%; border-radius: 15px; }
  .daily-quote { margin-top: 20px; background: var(--card); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; }
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px; margin-top: 15px;}
  .subject{background:var(--card); border-radius:15px; padding:15px; text-align:center; cursor:pointer;}
  .sub-banner{font-size: 30px; font-weight: bold;}
  
  .qa-box { background: var(--card); padding: 15px; border-radius: 8px; margin-top: 15px; }
  .qa-item { margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 5px;}
  .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; }
  .btn { display: block; text-align: center; background: var(--primary); color: #fff; padding: 10px; border-radius: 10px; text-decoration: none; margin-top: 10px; }
  
  .schedule-container { background: var(--card); border-radius: 12px; padding: 10px; overflow-x: auto; }
  .schedule-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
  .schedule-table th, .schedule-table td { border: 1px solid var(--line); padding: 8px; }
  
  .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--primary); }
  input:checked + .slider:before { transform: translateX(22px); }
</style>
</head>
<body>

<div id="splash-screen"><div class="glass-container"><h1 class="welcome-text">أهلاً وسهلاً</h1></div></div>
<div id="name-modal"><div class="name-box"><h2>أهلاً بك! 👋</h2><p>الرجاء إدخال اسمك</p><input type="text" id="student-name-input" placeholder="اسم المستخدم"><button onclick="saveName()">متابعة</button></div></div>

<header>
  <button id="back" class="header-btn" onclick="history.back()">↩</button>
  <h1 id="title"></h1>
  <button class="header-btn" style="display:block" onclick="location.hash='settings'">⚙️</button>
</header>

<main id="app"></main>

<script>let studentName = localStorage.getItem('studentName') || '';
let points = parseInt(localStorage.getItem('userPoints')) || 10;
let isDark = localStorage.getItem('theme') === 'dark';
if(isDark) document.body.classList.add('dark-mode');

setTimeout(() => {
    document.getElementById("splash-screen").style.display = 'none';
    if (!studentName) document.getElementById('name-modal').style.display = 'flex';
    else route();
}, 3000);

function saveName() {
    let input = document.getElementById('student-name-input').value.trim();
    if (input !== '') {
        localStorage.setItem('studentName', input);
        location.reload();
    }
}

function toggleTheme() {
    let dark = !document.body.classList.contains('dark-mode');
    if (dark) { document.body.classList.add('dark-mode'); localStorage.setItem('theme', 'dark'); }
    else { document.body.classList.remove('dark-mode'); localStorage.setItem('theme', 'light'); }
}

const DATA = [
  { id:"physics", name:"الفيزياء", icon:"⚛️", url: "https://www.mediafire.com/file/ghwtazf3tfk9ghp/file" },
  { id:"chemistry", name:"الكيمياء", icon:"🧪", url: "https://www.mediafire.com/file/8d0pt2eiwu75t17/file" },
  { id:"biology", name:"الأحياء", icon:"🧬", url: "https://www.mediafire.com/file/g0ws2vqqypw1x0q/file",
    questions: [
      "مهمات الدرس الأول: ما نوع التغذية في (الإنسان، النبات، الطلائعيات، الفطريات، البيوغدين.. الخ)؟ اشرح البلقعة الخلوية او الشرب الخلوي. عرف (الانتشار، النقل الفعال، الإخراج، الديدنيوم، الأميبا، التغذية الدمية، الغذاء).",
      "مهمات الدرس الثاني: معادلة البناء الضوئي، تعريفه، مكوناته، نواتجه. موقع الكلوروفيل، وظيفته، موقع تفاعلات الضوء ونواتجه، موقع تفاعلات الظلام ونواتجه. اشرح تفاعل الضوء، اشرح تفاعل الظلام. تعريف البلاستيدة وموقعها، الكرانو، الكران، قرص الشايكويد وموقعه، غشاء الشايكويد ووظيفته، السدى (الحشوة) وموقعها. أشكال البلاستيدات وموقعها. انواع الكلوروفيل وطول الموجي الذي يمتصه، أطوال الموجي الذي يمتصه. علل عدم امتصاص اللون الأخضر؟",
      "مهمات الدرس الثالث: تعريف الاصباغ المساعدة، لونها، بروتينية او دهنية. قارن بين الزانثوفيلات والفيوكوبيلينات، تكلم عن الزانثوفيلات، تكلم عن الفيوكوبيلينات. المواد الداخلة في البناء الضوئي. الماء كيف يدخل لنبات المائي وطحالب، كيف ينتقل، اين يصل، ما الكمية الممتصة. الماء كيف يدخل لنبات البري، كيف ينتقل، اين يصل. الماء لا يوجد في بكتريا الكبريت الأخضر بما يعوض. معادلة فان نيل الكيميائية غير مطلوبة.",
      "تكملة الدرس الثالث: ثنائي اوكسيد الكربون من أي تركيز ينتقل إلى أي تركيز؟ العوامل المؤثرة في البناء الضوئي. الماء، ماذا يحدث إذا قل الماء؟ إذا قل الضغط الانتخابي في الخلايا الحارسة؟ ثنائي اوكسيد الكربون، مصادره، نسبته بالجو. الضوء، ما تأثيره على أوراق النبات العالية، تأثيره على الأوراق السفلى لنبات، لماذا ينعدم البناء الضوئي عند طول موجي للون الأخضر؟، لماذا يقل عند اللون البرتقالي والاصفر؟ يكون أعلى معدل للبناء الضوئي عند طول موجي؟ تهوية التربة، لماذا تتم تهوية التربة؟ درجة الحرارة، معدل للبناء الضوئي عند درجة حرارة اقل ١٠ يحدث في؟ درجة الحرارة ٨٠ وأكثر هي المثلى لطحالب الينابيع الحارة، ما أفضل درجة حرارة للبناء الضوئي. الأمراض النباتية غير مطلوبة. أملاح التربة، على ماذا يؤثر نقص الحديد والمغنيسيوم؟، يتأثر بناء (أ) وديايلوز ثنائي الفوسفات عند نقصه؟، نقص المغنيز يؤثر على؟ العوامل الخارجية، مثل الدخان يغلق الثغور. عوامل الداخلية، مثل تركيب الورقة ويشمل عدد البلاستيدات فيها، كمية الكلوروفيل، سمك النصل، الخ.",
      "تكملة الدرس الرابع: البناء الكيميائي، المقارنة بين البكتيريا، موقع البكتيريا، وظيفتها، الاكسدة، تعريف البكتيريا. الايثل الغذائي، تعريفه، مكوناته الأربعة بتسلسل. الهضم في الحيوانات. الهضم بطريقة مباشرة. تعريفه، يحدث في الطفيليات الامعاء والدم، ما طريقة تغذية الدميع؟ ما طريقة تغذية الخفاش الماص للدم؟ التغذية على الهائمات. تعريف الهائمات، لماذا لا تقاوم تيارات الماء العالية؟ اين توجد الهائمات؟ التغذية بواسطة الترشيح، تحدث عبر تراكيب جسمية كما في الدميع، حوت البالين، الرخويات ثنائية الصدفة... الخ. وتحدث أيضا عبر طبقة مخاطية تلتصق فيها كما في حيوان؟. التغذية بواسطة الترسيب كما في الديدان الحلقية، ما هي المواد المترسبة في قاع المحيط تتغذى عليها الديدان الحلقية؟ على ماذا تتغذى الديدان الحلقية؟ ما نوع التغذية في القشريات؟ في الدميع؟ في حوت البالين؟ الديدان الحلقية؟ رخويات ثنائية الصدفة؟ الخ.",
      "تكملة الدرس الرابع: التغذية على كتل الطعام من خلال تحورات أربعة، تحورات القشريات وشرحها، تحورات الحشرات وشرحها عددها، وظائفها، النيرس تعريفه، وظيفة البلعوم، المفترسات وظيفة الأطراف الأمامية. الأسنان في ثدييات، عدد انواعها، وظائفها، تحورات الأسنان في القواطع وشرحها والانياب وشرحها وطواحن البقر والحصان وشرحها. التغذية على السوائل، طفيلي خارجي اشرحها، مثال عليها، طفيلي داخلي اشرحها، مثال عليها. الهضم داخلي اشرحه، اين يحدث، في اي حيوان، نوع الطعام صغير أو كبير. الهضم الخارجي، اشرحه، في اي حيوان، نوع الطعام. حيوان يحدث فيه هضم خارجي وداخلي؟",
      "مهمات الدرس الخامس: منطقة التوصيل، البلعوم وظيفته، في اي كائن؟ المدريء، الحويصلة ووظائفها الثلاثة، موقعها، تعريفها. منطقة الطحن والهضم انواع المعدة ثلاثة، في الطيور، تركيبها نسيج ضام مدعم، وظيفتها طحن. المعدة في آكلات اللحوم والأعشاب، تركيبها تركيب عضلي، وظيفتها انتاج انزيمات، والـ HCL، ما وظائف الـ HCL. المعدة في الإنسان، انواع الخلايا الجدارية ورئيسة، الرئيسة رينين وظيفته وموقعه وبيبسين وظيفته وموقعه، الجدارية HCL وظيفته وموقعه. منطقة الهضم النهائي والامتصاص، طول الامعاء، نوعين، في اي كائن، الصمام الحلزوني موقعه وظيفته تعريفه، الزغابات موقعها وظيفتها تعريفها، زغيبات موقعها وظيفتها تعريفها. العصارة البنكرياسية كميتها باليوم، ٥ انزيمات، وظائفها. عصارة الصفراء، موقع إنتاجها، موقع افرازها، موقع خزنها، موقع صبها، وظيفتها، تركيبها، لماذا البراز أصفر اللون؟ وظائف الكبد ٧. وظائف الأمعاء الدقيقة ٣، تمتص الكهروهيدرات... الخ، تمتص البروتينات... الخ، الدهون لا تمتص... الخ.",
      "تكملة الدرس الخامس: القناة الهضمية غير المكتملة، في اي حيوان؟ اين تبدأ واين تنتهي؟ ما غذاء البلاناريا؟ مكونات قناة البلاناريا؟ نوع الهضم في البلاناريا؟ القناة المكتملة، في اي حيوان؟ ما هو غذاء دودة الأرض؟ اين تبدأ واين تنتهي؟ مكونات قناة دودة الأرض؟ الحوصلة تعريفها موقعها وظيفتها؟ القانصة تعريفها موقعها وظيفتها؟ التغلوسول تعريفها موقعها وظيفتها؟ نوع الهضم في القناة؟ الحركة في الأمعاء ثلاث انواع، تجويف حقيقي (انقباض وانبساط)، تجويف كاذب (ببواسطة الاهداب)، كلا الطريقتين (انقباض وانبساط + الاهداب). ميزة الحركة دودية؟ تشريح القناة. منطقة استقبال الغذاء، الفم، الجوف الفمي وملحقاته، الاميليز وظيفته موقعه، لماذا لا يعمل في المعدة؟",
      "تكملة الدرس الأخير من الفصل الأول: مهمات منطقة امتصاص الماء، ثلاث انواع، في الطيور والزواحف، تتمثل بماذا؟ ما وظيفة فتحة المجمع. في الحشرات ذات المناطق الجافة، تتمثل بماذا؟ ما وظيفة غدد المستقيم. القولون في الإنسان، ما وظيفة البكتيريا النافعة؟ الفيتامينات K و B ما موقعها؟ ما نسبتها؟ المتطلبات الغذائية. الطاقة ومصدرها، الوظيفة والتركيب ومصدرها. الكروهيدرات، مصدرها، إلى ماذا تتحول بعد الهضم؟ انواعها، الذائبة مثال عليها؟ وظيفتها؟، غير الذائبة، مثال عليها؟، وظيفتها؟، ارتفاع الالياف في الطعام؟ البروتينات، مصدرها مشبع؟ غير مشبع؟، ٢٠ حامض اميني توزيعها؟، الدهون، متمثله بماذا؟ كم حامض دهني يحتاج الإنسان؟ اوميكا ٣ موقعه؟ وظيفته؟ لماذا سكان الاسكيمو لا يصابون بأمراض القلب؟ الفيتامينات، وظيفتها؟ المعادن غير مطلوبة."
    ]
  },
  { id:"math", name:"الرياضيات", icon:"📐", url: "https://www.mediafire.com/file/6rpkonchci69tgu/file" },
  { id:"arabic", name:"العربية", icon:"📖", url: "https://www.mediafire.com/file/p7rxsjuck2najrf/file" },
  { id:"english", name:"الإنكليزية", icon:"🔤", url: "https://www.mediafire.com/file/88myt3ywwspo4mi/file" },
  { id:"islamic", name:"الإسلامية", icon:"🕌", url: "https://www.mediafire.com/file/xp1tzjwiv3jhqc1/file" }
];

const app = document.getElementById('app');
const title = document.getElementById('title');
const backBtn = document.getElementById('back');

function route() {
    const hash = location.hash.slice(1);
    if (hash === '') showMainMenu();
    else if (hash === 'settings') showSettings();
    else if (hash === 'schedule') showSchedule();
    else showSubject(hash);
}

function showMainMenu() {
    title.textContent = 'الرئيسية'; backBtn.style.display = 'none';
    let html = `
        <div class="points-card"><h3>أهلاً ${studentName}</h3><p>نقاطك: ${points} ⭐</p></div>
        <div class="menu-card" onclick="location.hash='summaries'"><h2>ملخص المناهج</h2><span>📖</span></div>
        <div class="menu-card" onclick="location.hash='schedule'"><h2>الجدول الدراسي</h2><span>📅</span></div>
        <a href="https://t.me/mortada7799" target="_blank" class="menu-card" style="text-decoration:none;"><h2>للمساعدة</h2><span>💬</span></a>
        <div class="gif-container"><img src="ezgif-7138c0fd07f42e99.gif"></div>
        <div class="daily-quote">اجعل من دراستك سلاحاً لتحقيق أحلامك.</div>`;
    app.innerHTML = html;
}

function showSettings() {
    title.textContent = 'الإعدادات'; backBtn.style.display = 'block';
    app.innerHTML = `<div class="card"><label><input type="checkbox" onchange="toggleTheme()" ${isDark?'checked':''}> الوضع الليلي</label></div>`;
}

function showSchedule() {
    title.textContent = 'الجدول الدراسي'; backBtn.style.display = 'block';
    let html = `<div class="schedule-container"><table class="schedule-table"><tr><th>اليوم</th><th>الحصة 1</th><th>الحصة 2</th></tr>`;
    html += `<tr><td>الأحد</td><td>عربي</td><td>رياضة</td></tr>`;
    html += `<tr><td>الاثنين</td><td>رياضيات</td><td>كيمياء</td></tr>`;
    html += `<tr><td>الثلاثاء</td><td>أحياء</td><td>رياضيات</td></tr>`;
    html += `<tr><td>الأربعاء</td><td>عربي</td><td>كيمياء</td></tr>`;
    html += `<tr><td>الخميس</td><td>كيمياء</td><td>فيزياء</td></tr>`;
    html += `</table></div>`;
    app.innerHTML = html;
}

function showSubject(id) {
    let s = DATA.find(x => x.id === id);
    if (!s) {
        title.textContent = 'المواد';
        backBtn.style.display = 'block';
        let html = '<div class="grid">';
        DATA.forEach(sub => {
            html += `<div class="subject" onclick="location.hash='${sub.id}'"><div class="sub-banner">${sub.icon}</div><b>${sub.name}</b></div>`;
        });
        html += '</div>';
        app.innerHTML = html;
        return;
    }
    
    title.textContent = s.name; backBtn.style.display = 'block';
    let html = `<div class="card"><h3>${s.name}</h3><a class="btn" href="${s.url}" target="_blank">تحميل الملزمة 📥</a></div>`;
    if (s.questions) {
        html += `<div class="qa-box"><h3>📝 أسئلة الأحياء</h3>`;
        s.questions.forEach(q => html += `<div class="qa-item">${q}</div>`);
        html += `</div>`;
    }
    app.innerHTML = html;
}

backBtn.onclick = () => history.back();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
