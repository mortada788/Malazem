<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>ملخص مناهج خامس علمي</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#64748b;--primary:#1a73e8;--line:#e2e8f0;--radius:16px}
  @media (prefers-color-scheme: dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:20px}
  
  header{background:var(--primary);color:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  header h1{font-size:18px;margin:0;flex:1;font-weight:700}
  .header-icon { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.2); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 22px; }
  #back{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 5px;display:none}
  
  main{padding:16px;max-width:720px;margin:auto}
  .main-menu { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
  
  .menu-card { display: flex; align-items: center; justify-content: space-between; padding: 25px 20px; border-radius: 20px; text-decoration: none; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.15); transition: transform 0.2s; cursor: pointer; }
  .menu-card:active { transform: scale(0.98); }
  
  .card-summaries { background: linear-gradient(135deg, #1a73e8, #1557b0); }
  .card-support { background: linear-gradient(135deg, #0088cc, #005f8f); }
  
  .card-text { flex: 1; text-align: right; }
  .card-text h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; }
  .card-text p { margin: 0; font-size: 14px; opacity: 0.9; }
  .card-icon { font-size: 48px; margin-left: 15px; opacity: 0.8; }

  .gif-container { margin-top: 20px; display: flex; justify-content: center; }
  .gif-container img { width: 65%; max-width: 280px; height: auto; display: block; border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
  .daily-quote { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-right: 5px solid #0f9d58; padding: 15px 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-weight: 700; font-size: 16px; color: var(--text); }

  .school-banner { display: flex; align-items: center; background: linear-gradient(135deg, #0f9d58, #0b6b3a); border-radius: 20px; padding: 15px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(15, 157, 88, 0.3); color: #fff; gap: 15px; }
  .school-logo { width: 70px; height: 70px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 3px solid rgba(255,255,255,0.8); flex-shrink: 0; }
  .school-logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
  .school-info { flex: 1; }
  .school-info h2 { margin: 0 0 5px 0; font-size: 20px; font-weight: 800; }
  .school-info p { margin: 0; font-size: 13px; opacity: 0.9; }

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px; margin-top: 16px;}
  .subject{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s}
  .subject:active{transform:scale(.97)}
  .sub-banner{background:var(--c);color:#fff;height:70px;display:flex;align-items:center;justify-content:center;font-size:36px}
  .sub-info{padding:12px}
  .sub-info b{display:block;font-size:15px;margin-bottom:4px}
  .sub-info small{color:var(--muted);font-size:12px}
  
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .meta{color:var(--muted);font-size:13px;margin:8px 0 12px}
  .btn{display:block;text-align:center;background:var(--primary);color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px}
  
  .qa-box { background: var(--card); border-right: 4px solid #e8710a; padding: 15px; border-radius: 8px; margin-top: 15px; margin-bottom: 15px; }
  .qa-box h3 { color: #e8710a; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .qa-item { margin-bottom: 12px; font-size: 14px; line-height: 1.6; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  .qa-item:last-child { border-bottom: none; }
  .qa-item strong { color: var(--text); font-weight: bold; display: block; margin-bottom: 4px; }
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:15px}

  #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to right, #24243e, #302b63, #0f0c29); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.8s ease, visibility 0.8s ease; overflow: hidden; }
  #splash-screen::before, #splash-screen::after { content: ''; position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; }
  #splash-screen::before { width: 300px; height: 300px; background: rgba(138, 43, 226, 0.4); top: -50px; right: -50px; animation: float 6s infinite alternate; }
  #splash-screen::after { width: 400px; height: 400px; background: rgba(65, 105, 225, 0.3); bottom: -100px; left: -100px; animation: float 8s infinite alternate-reverse; }
  .glass-container { text-align: center; padding: 50px 30px; border-radius: 24px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); width: 85%; max-width: 350px; }
  .welcome-text { font-family: system-ui, sans-serif; font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 35px; opacity: 0; transform: scale(0.5); animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-shadow: 0 4px 15px rgba(138, 43, 226, 0.5); }
  .loading-bar-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; opacity: 0; animation: fadeIn 0.5s ease-out 1s forwards; }
  .loading-bar { width: 0%; height: 100%; background: linear-gradient(to right, #8a2be2, #4169e1); border-radius: 10px; animation: fillBar 3.5s ease-in-out 1s forwards; }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
  @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(30px) scale(1.1); } }
  .splash-hidden { opacity: 0; visibility: hidden; }
</style>
</head>
<body>

<div id="splash-screen">
    <div class="glass-container">
        <h1 class="welcome-text">أهلاً وسهلاً</h1>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>
</div>

<header>
  <button id="back">↩</button>
  <div class="header-icon" id="header-icon">📚</div>
  <h1 id="title"></h1>
</header>

<main id="app"></main>

<script>
document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() {
        var splash = document.getElementById("splash-screen");
        if (splash) {
            splash.classList.add("splash-hidden");
            setTimeout(function() { splash.remove(); }, 800); 
        }
    }, 5000); 
});

const ART = { physics:'⚛️', chemistry:'🧪', biology:'🧬', math:'📐', arabic:'📖', english:'🔤', islamic:'🕌' };
const DATA = [
  { id:"physics", name:"الفيزياء", icon:"⚛️", color:"#1a73e8", handouts:[{ title: "ملزمة الفيزياء", teacher: "علي الذهبي", url: "https://www.mediafire.com/file/ghwtazf3tfk9ghp/علي_الذهبي_الخامس_العلمي_2026+(1).pdf/file" }] },
  { id:"chemistry", name:"الكيمياء", icon:"🧪", color:"#0f9d58", handouts:[{ title: "ملزمة الكيمياء", teacher: "حسين حمزة", url: "https://www.mediafire.com/file/8d0pt2eiwu75t17/الكيمياء_حسين_حمزة_الجزء_الاول_الجزء_الاول_2027.pdf/file" }] },
  { id:"biology", name:"الأحياء", icon:"🧬", color:"#e8710a", handouts:[{ title: "ملزمة الأحياء", teacher: "سجاد حمزة", url: "https://www.mediafire.com/file/g0ws2vqqypw1x0q/الاحياء_سجاد_حمزة_الخامس_العلمي_2027.pdf/file" }], questions: ["مهمات الدرس الأول...", "مهمات الدرس الثاني..."] },
  { id:"math", name:"الرياضيات", icon:"📐", color:"#9334e6", handouts:[{ title: "ملزمة الرياضيات", teacher: "حيدر وليد", url: "https://www.mediafire.com/file/6rpkonchci69tgu/الرياضيات_حيدر_وليد_الجزء_الاول_الخامس_العلمي_2026(2)+(1).pdf/file" }] },
  { id:"arabic", name:"اللغة العربية", icon:"📖", color:"#c5221f", handouts:[{ title: "ملزمة اللغة العربية", teacher: "سمر علي أحمد", url: "https://www.mediafire.com/file/p7rxsjuck2najrf/العربي_سمر_علي_احمد_الجزء_الاول_الخامس_الاعدادي_2026.pdf/file" }] },
  { id:"english", name:"اللغة الإنكليزية", icon:"🔤", color:"#00838f", handouts:[{ title: "ملزمة اللغة الإنكليزية", teacher: "علي الغرابي", url: "https://www.mediafire.com/file/88myt3ywwspo4mi/علي_الغرابي_الخامس_العلمي_2026.pdf/file" }] },
  { id:"islamic", name:"التربية الإسلامية", icon:"🕌", color:"#5f6368", handouts:[{ title: "ملزمة التربية الإسلامية", teacher: "ساجد العكيلي", url: "https://www.mediafire.com/file/xp1tzjwiv3jhqc1/الاسلامية_ساجد_العكيلي_الخامس_الاعدادي_2027.pdf/file" }] }
];
const DAILY_QUOTES = ["النجاح يبدأ بخطوة، فابدأ اليوم!","لا تحلم بالنجاح، بل اعمل من أجله.","كل صفحة تقرأها تقربك من حلمك.","الجد والمثابرة هما مفتاح التفوق.","لا يوجد مستحيل أمام الإرادة القوية.","تعبك اليوم هو راحتك غداً.","اجعل من دراستك سلاحاً لتحقيق أحلامك."];

const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('back');
const headerIcon = document.getElementById('header-icon');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';

function route(){
  const hash = location.hash.slice(1);
  if (hash === 'summaries') { showSummariesPage(); } 
  else if (hash === '') { showMainMenu(); } 
  else {
      const sub = DATA.find(s => s.id === hash);
      if (sub) showSubject(sub);
      else showMainMenu();
  }
}

function showMainMenu(){
  titleEl.textContent = 'الرئيسية';
  headerIcon.textContent = '📚'; 
  backBtn.style.display = 'none';
  const dayOfMonth = new Date().getDate();
  const currentQuote = DAILY_QUOTES[dayOfMonth % DAILY_QUOTES.length];
  
  let html = `
    <div class="main-menu">
        <div class="menu-card card-summaries" onclick="location.hash='summaries'">
            <div class="card-text"><h2>ملخص مناهج خامس علمي</h2><p>اضغط للدخول إلى المواد الدراسية</p></div><div class="card-icon">📖</div>
        </div>
        <a href="https://t.me/mortada7799" target="_blank" class="menu-card card-support" style="text-decoration:none;">
            <div class="card-text"><h2>للمساعدة</h2><p>تواصل معنا عبر التليكرام</p></div><div class="card-icon">💬</div>
        </a>
    </div>
    <div class="gif-container"><img src="ezgif-7138c0fd07f42e99.gif" alt="إعلان"></div>
    <div class="daily-quote">${currentQuote}</div>
  `;
  app.innerHTML = html;
}

function showSummariesPage(){
  titleEl.textContent = 'ملخص مناهج خامس';
  headerIcon.textContent = '📖';
  backBtn.style.display = 'block';
  let html = `<div class="school-banner"><div class="school-logo"><img src="logo.png" onerror="this.style.display='none'; this.parentElement.innerHTML='🏫';"></div><div class="school-info"><h2>مثابرون</h2><p>إعدادية المثابرون للبنين</p></div></div>`;
  html += '<div class="grid">';
  for (let i = 0; i < DATA.length; i++) {
    let s = DATA[i];
    html += `<div class="subject" style="--c:${s.color}" onclick="location.hash='${s.id}'"><div class="sub-banner">${ART[s.id] || s.icon}</div><div class="sub-info"><b>${esc(s.name)}</b><small>${s.handouts.length} ملزمة ${s.questions ? '• صندوق أسئلة' : ''}</small></div></div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function showSubject(s){
  titleEl.textContent = s.name;
  backBtn.style.display = 'block';
  headerIcon.textContent = (ART[s.id] || s.icon);
  let html = '';
  const list = s.handouts;
  html += list.length ? list.map(h=>`<div class="card"><h3>${esc(h.title)}</h3><div class="meta">الأستاذ: ${esc(h.teacher)}</div><a class="btn" href="${esc(safeUrl(h.url))}" target="_blank" rel="noopener">تحميل من ميديافاير 📥</a></div>`).join('') : '<div class="empty">ما كو ملازم بعد</div>';
  if (s.questions && s.questions.length > 0) {
      html += `<div class="qa-box"><h3>📝 صندوق أسئلة الأحياء</h3>${s.questions.map(q => `<div class="qa-item"><strong>•</strong> ${esc(q)}</div>`).join('')}</div>`;
  }
  app.innerHTML = html;
}

backBtn.onclick = () => history.back();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
