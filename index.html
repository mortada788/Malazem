<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<title>ملازم خامس علمي</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#64748b;--primary:#1a73e8;--line:#e2e8f0;--radius:16px}
  @media (prefers-color-scheme: dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:20px}
  header{background:var(--primary);color:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  header h1{font-size:18px;margin:0;flex:1}
  #back{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:0 5px;display:none}
  main{padding:16px;max-width:720px;margin:auto}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .subject{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
  .subject:active{transform:scale(.97)}
  .sub-banner{background:var(--c);color:#fff;height:70px;display:flex;align-items:center;justify-content:center;font-size:36px}
  .sub-info{padding:12px}
  .sub-info b{display:block;font-size:15px;margin-bottom:4px}
  .sub-info small{color:var(--muted);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .meta{color:var(--muted);font-size:13px;margin:8px 0 12px}
  .btn{display:block;text-align:center;background:var(--primary);color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:15px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
  .chip{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* ستايل شاشة الترحيب */
  #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; overflow: hidden; transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #splash-screen::before, #splash-screen::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1;
  }
  #splash-screen::before {
      width: 300px; height: 300px; background: rgba(138, 43, 226, 0.4);
      top: -50px; right: -50px; animation: float 6s infinite alternate;
  }
  #splash-screen::after {
      width: 400px; height: 400px; background: rgba(65, 105, 225, 0.3);
      bottom: -100px; left: -100px; animation: float 8s infinite alternate-reverse;
  }
  .glass-container {
      text-align: center; padding: 50px 30px; border-radius: 24px;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); width: 85%; max-width: 350px;
  }
  .welcome-text {
      font-family: system-ui, sans-serif; font-size: 36px; font-weight: 900; color: #fff;
      margin-bottom: 35px; opacity: 0; transform: scale(0.5);
      animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-shadow: 0 4px 15px rgba(138, 43, 226, 0.5);
  }
  .loading-bar-container {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1);
      border-radius: 10px; overflow: hidden; opacity: 0; animation: fadeIn 0.5s ease-out 1s forwards;
  }
  .loading-bar {
      width: 0%; height: 100%; background: linear-gradient(to right, #8a2be2, #4169e1);
      border-radius: 10px; animation: fillBar 3.5s ease-in-out 1s forwards;
  }
  @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
  @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(30px) scale(1.1); } }
  .splash-hidden { opacity: 0; visibility: hidden; }
</style>
</head>
<body>

<!-- شاشة الترحيب -->
<div id="splash-screen">
    <div class="glass-container">
        <h1 class="welcome-text">أهلاً وسهلاً</h1>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>
</div>

<!-- هيدر التطبيق -->
<header>
  <button id="back">↩</button>
  <h1 id="title"></h1>
</header>

<main id="app"></main>

<script>
// شاشة الترحيب تختفي بعد 5 ثواني
document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() {
        var splash = document.getElementById("splash-screen");
        if (splash) {
            splash.classList.add("splash-hidden");
            setTimeout(function() { splash.remove(); }, 800); 
        }
    }, 5000); 
});

// بيانات التطبيق (بدون ملخصات)
const ART = { physics:'⚛️', chemistry:'🧪', biology:'🧬', math:'📐', arabic:'📖', english:'🔤', islamic:'🕌' };

const DATA = [
  {
    id:"physics", name:"الفيزياء", icon:"⚛️", color:"#1a73e8",
    handouts:[
      { title: "ملزمة الفيزياء", teacher: "عام", url: "https://teraboxlink.com/s/1_V07xgYMiJpqFzxz6I8COw" }
    ]
  },
  {
    id:"chemistry", name:"الكيمياء", icon:"🧪", color:"#0f9d58",
    handouts:[
      { title: "ملزمة الكيمياء", teacher: "عام", url: "https://teraboxlink.com/s/1Ji0HiDOscURHNU6eKHi8Bg" }
    ]
  },
  {
    id:"biology", name:"الأحياء", icon:"🧬", color:"#e8710a",
    handouts:[
      { title: "ملزمة الأحياء", teacher: "عام", url: "https://teraboxlink.com/s/1_V07xgYMiJpqFzxz6I8COw" }
    ]
  },
  {
    id:"math", name:"الرياضيات", icon:"📐", color:"#9334e6",
    handouts:[]
  },
  {
    id:"arabic", name:"اللغة العربية", icon:"📖", color:"#c5221f",
    handouts:[
      { title: "ملزمة اللغة العربية", teacher: "عام", url: "https://teraboxlink.com/s/1_V07xgYMiJpqFzxz6I8COw" }
    ]
  },
  {
    id:"english", name:"اللغة الإنكليزية", icon:"🔤", color:"#00838f",
    handouts:[
      { title: "ملزمة اللغة الإنكليزية", teacher: "عام", url: "https://teraboxlink.com/s/1aftxSaGzYGZe0FTPk3kV7g" }
    ]
  },
  {
    id:"islamic", name:"التربية الإسلامية", icon:"🕌", color:"#5f6368",
    handouts:[
      { title: "ملزمة التربية الإسلامية", teacher: "عام", url: "https://teraboxlink.com/s/1NVKe6ijJ6WoQs21T_Tf6kw" }
    ]
  }
];

const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('back');
let teacher = 'الكل';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';

function route(){
  const id = location.hash.slice(1);
  const sub = DATA.find(s => s.id === id);
  sub ? showSubject(sub) : showHome();
}

function showHome(){
  titleEl.textContent = 'ملازم خامس علمي';
  backBtn.style.display = 'none';
  let html = '<div class="grid">';
  for (let i = 0; i < DATA.length; i++) {
    let s = DATA[i];
    html += '<div class="subject" style="--c:' + s.color + '" onclick="location.hash=\'' + s.id + '\'">';
    html += '<div class="sub-banner">' + (ART[s.id] || s.icon) + '</div>';
    html += '<div class="sub-info">';
    html += '<b>' + esc(s.name) + '</b>';
    // هنا عرضنا عدد الملازم فقط
    html += '<small>' + s.handouts.length + ' ملزمة</small>';
    html += '</div></div>';
  }
  html += '</div>';
  app.innerHTML = html;
}

function showSubject(s){
  titleEl.textContent = s.name;
  backBtn.style.display = 'block';
  
  // شلنا التبويبات (tabs) وخلياها تعرض الملازم مباشرة
  const teachers = ['الكل', ...new Set(s.handouts.map(h=>h.teacher))];
  let html = '';
  if(teachers.length>2){
    html += '<div class="chips">' + teachers.map(t=>`<button class="chip ${t===teacher?'on':''}" data-te="${esc(t)}">${esc(t)}</button>`).join('') + '</div>';
  }
  
  const list = s.handouts.filter(h => teacher==='الكل' || h.teacher===teacher);
  html += list.length ? list.map(h=>`<div class="card"><h3>${esc(h.title)}</h3><div class="meta">الأستاذ: ${esc(h.teacher)}</div><a class="btn" href="${esc(safeUrl(h.url))}" target="_blank" rel="noopener">فتح / تحميل</a></div>`).join('')
                      : '<div class="empty">ما كو ملازم بعد</div>';
  
  app.innerHTML = html;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{teacher=b.dataset.te;showSubject(s);});
}

backBtn.onclick = () => history.back();
window.addEventListener('hashchange', route);
route();
</script>
</body>
  </html>
